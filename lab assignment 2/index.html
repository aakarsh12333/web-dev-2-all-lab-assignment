<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Weather track</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1 id="main-heading">⛅Async weather Tracker</h1>
    </header>
    <section>
        <main>
            <div id="inputBox1">
                <h5>Search City</h5>
                <input type="text" placeholder="Delhi London">
                <button onsubmit="SubmitHandler">Submit</button>
                <h5>Search History</h5>
            </div>
            <div id="weather-info">
                <h5>Weather info</h5>
            </div>
        </main>
    </section>
    <script src="./script.js"></script>
</body>
</html>
